# -----------------------------------------------------------------------------
# Windows / Docker Desktop (WSL2) overlay — Frigate's LEAST-supported target.
# Prefer a Pi or mini-PC as a primary host; use this only if you must.
#
# WSL2 NAT hides the host IP, so host networking doesn't expose a reachable
# WebRTC candidate. We switch to bridge networking with explicit port mappings.
# You MUST ALSO:
#   1) In .env set HOST_LAN_IP to the Windows machine's LAN IP.
#   2) In frigate/config.yml uncomment the `go2rtc: webrtc: candidates:` block.
#   3) In frigate/config.yml set mqtt host to `host.docker.internal`.
# Otherwise WebRTC silently falls back to MSE (~1s instead of ~0.5s).
#
# Apply:  docker compose -f docker-compose.yml -f compose.windows.yml up -d
# Then:   paste frigate/host-presets/cpu.yml (or nvidia if a GPU is exposed) into config.
# -----------------------------------------------------------------------------

services:
  frigate:
    network_mode: "bridge"   # override the base's host networking
    ports:
      - "5000:5000"          # Frigate UI
      - "8971:8971"          # Frigate authenticated UI
      - "1984:1984"          # go2rtc UI
      - "8554:8554"          # RTSP restream
      - "8555:8555/tcp"      # WebRTC
      - "8555:8555/udp"      # WebRTC

  # Dashboard on bridge networking with a published port. On Windows you MUST also
  # edit dashboard/config.yaml to reach the other services by their compose service
  # names instead of 127.0.0.1, e.g.:
  #   frigate.base_url: http://frigate:5000   mqtt_addr: tcp://mqtt:1883
  #   go2rtc_url: http://frigate:1984         docker.host: tcp://dockerproxy:2375
  #   ntfy.base_url: http://ntfy:8092
  dashboard:
    network_mode: "bridge"
    ports:
      - "8088:8088"
  ntfy:
    network_mode: "bridge"
    ports:
      - "8092:8092"
