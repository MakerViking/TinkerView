# Continuous integration: Go (format, vet, race tests), frontend (typecheck,
# build), compose file validation, and a no-push build of the dashboard image.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every documented overlay combination must at least parse and interpolate.
      - name: docker compose config
        run: |
          cp .env.example .env
          for overlay in nvidia intel amd-rocm cpu pi bridge; do
            echo "== $overlay"
            docker compose -f docker-compose.yml -f "compose.${overlay}.yml" config --quiet
          done
          docker compose -f docker-compose.yml -f compose.cpu.yml -f compose.mqtt-lan.yml config --quiet
          docker compose -f docker-compose.yml -f compose.intel.yml -f compose.coral.yml config --quiet
          docker compose -f docker-compose.yml -f compose.cpu.yml -f compose.tailscale.yml config --quiet
          docker compose -f docker-compose.yml -f compose.cpu.yml -f compose.selinux.yml config --quiet

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on GitHub's ubuntu runners.
      - name: shellcheck install.sh
        run: |
          bash -n install.sh
          shellcheck install.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only (no push). Release images are built by release.yml on v* tags.
      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          push: false
          tags: tinkerview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
