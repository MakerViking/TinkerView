# -----------------------------------------------------------------------------
# Tailscale sidecar — exposes ONLY the dashboard (:8088) on your tailnet via
# Tailscale Serve (private to the tailnet; NOT a public Funnel). Uses Tailscale's
# userspace mode.
#
# Setup:
#   1) Generate a Tailscale auth key: admin console > Settings > Keys >
#      "Generate auth key" (reusable + ephemeral is fine). Put it in .env:
#        TS_AUTHKEY=tskey-auth-xxxxxxxxxxxx
#      (Without a key the container instead prints a one-time login URL in its
#       logs — `docker logs tinkerview-tailscale` — that you open to authorize.)
#   2) Apply (add this overlay to the usual command):
#        docker compose -f docker-compose.yml -f compose.nvidia.yml \
#          -f compose.tailscale.yml --env-file .env up -d tailscale
#   2b) Set DASHBOARD_TOKEN in .env too: anyone on your tailnet can reach the
#      dashboard through this, so decide who that should be (ACLs) and gate it.
#   3) The dashboard is then reachable from any device on your tailnet at
#        https://tinkerview.<your-tailnet>.ts.net
#
# network_mode: host lets Serve proxy to the host-networked dashboard at
# 127.0.0.1:8088. TS_USERSPACE=true means no tun device / NET_ADMIN needed.
# Serve only forwards :8088, so nothing else on the host is exposed.
# -----------------------------------------------------------------------------
services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.2}
    container_name: tinkerview-tailscale
    hostname: tinkerview
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: tinkerview
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - ./tailscale/serve.json:/config/serve.json:ro
      - ./tailscale/state:/var/lib/tailscale
    restart: unless-stopped
