# LAN-facing Mosquitto config, used ONLY by compose.mqtt-lan.yml (mounted over
# mosquitto/config/mosquitto.conf). Keeps the anonymous listener for Frigate and
# the dashboard (published on host loopback only) and adds a password-protected
# listener on 1884 for Home Assistant or other machines.
#
# Create the password file BEFORE starting with this config, or the broker will
# refuse to start:
#   docker exec -it mosquitto mosquitto_passwd -c /mosquitto/data/passwd homeassistant

per_listener_settings true

# Local-only (compose publishes this on 127.0.0.1): Frigate + dashboard.
listener 1883
allow_anonymous true

# LAN: username + password required.
listener 1884
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
