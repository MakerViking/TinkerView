# Mosquitto for TinkerView: the Frigate <-> dashboard <-> Home Assistant bus.
#
# DEFAULT (this file): one anonymous listener, and docker-compose.yml publishes
# it on the HOST'S LOOPBACK ONLY (127.0.0.1:1883). Frigate and the dashboard run
# on the host network and reach it there; so does Home Assistant if it runs on
# the same machine with host networking. Nothing on your LAN can connect.
# Port 1883 inside the container is not exposed anywhere else.
#
# Want Home Assistant (or anything else) on ANOTHER machine, or in a bridge
# container, to reach the broker? Do NOT just publish 1883 to the LAN. Use the
# authenticated second listener instead; it leaves this anonymous listener on
# loopback so Frigate and the dashboard keep working (the dashboard has no MQTT
# credential setting). Steps, run from the repo root:
#
#   1) Create the first user (prompts for a password; broker must be running):
#        docker exec -it mosquitto mosquitto_passwd -c /mosquitto/data/passwd homeassistant
#      More users: the same command WITHOUT -c.
#   2) Re-create the broker with the LAN overlay added to your usual command:
#        docker compose -f docker-compose.yml -f compose.<preset>.yml \
#          -f compose.mqtt-lan.yml up -d mqtt
#      (compose.mqtt-lan.yml swaps in mosquitto/mosquitto.lan.conf and publishes
#       port 1884, password-protected.)
#   3) Point the other client at <this-host-ip>:1884 with that username/password.
#
# The password file lives in mosquitto/data/ (gitignored). Traffic is plain
# MQTT, so use this on a trusted LAN or tailnet only; for anything wider, add
# TLS (see the Mosquitto docs) rather than exposing it as-is.

# Each listener below has its own authentication rules.
per_listener_settings true

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
