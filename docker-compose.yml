# =============================================================================
# TinkerView — base stack (Frigate + Mosquitto)
#
# Frigate bundles go2rtc. go2rtc opens ONE upstream connection per camera and
# fans it out to unlimited viewers — this is the fix for cameras that allow only
# one client at a time. Frigate adds the dashboard grid, NVR recording, object
# detection, low-latency WebRTC, and the Home Assistant integration.
#
# This base file is HOST-AGNOSTIC. Pick exactly ONE host overlay and run:
#   docker compose -f docker-compose.yml -f compose.nvidia.yml up -d   # Nvidia GPU box (Unraid, Linux)
#   docker compose -f docker-compose.yml -f compose.intel.yml  up -d   # Intel iGPU box
#   docker compose -f docker-compose.yml -f compose.amd-rocm.yml up -d # AMD GPU box
#   docker compose -f docker-compose.yml -f compose.cpu.yml    up -d   # safe CPU-only fallback
#   docker compose -f docker-compose.yml -f compose.pi.yml     up -d   # Raspberry Pi (arm64)
#   docker compose -f docker-compose.yml -f compose.bridge.yml up -d   # Windows, or a host port conflict
# Optional: password-protected MQTT for Home Assistant on another machine:
#   docker compose -f docker-compose.yml -f compose.<preset>.yml -f compose.mqtt-lan.yml up -d
# (see the comments in mosquitto/config/mosquitto.conf for the exact steps).
# A Coral EdgeTPU (USB/PCIe) can be STACKED on any host for detection while that
# host's GPU still decodes, e.g.:
#   docker compose -f docker-compose.yml -f compose.intel.yml -f compose.coral.yml up -d
#
# Then paste the matching frigate/host-presets/<host>.yml into the HOST-SPECIFIC
# block at the top of frigate/config.yml. Full hardware matrix + how to choose a
# detector vs decoder: frigate/host-presets/README.md.
# =============================================================================

services:
  frigate:
    container_name: frigate
    # Pinned for reproducibility. VERIFY the current stable tag at
    # https://github.com/blakeblackshear/frigate/releases and override in .env.
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.17.1}
    restart: unless-stopped
    stop_grace_period: 30s
    # Host networking is required for low-latency WebRTC (port 8555 TCP+UDP) and
    # for ONVIF camera autodiscovery. It also means Frigate shares the host's
    # loopback: a port already taken on the host (including its internal API on
    # 127.0.0.1:5001) crash-loops the container. Overridden by compose.bridge.yml.
    network_mode: host
    # Frigate gets ONLY the variables below, not the whole .env: DASHBOARD_TOKEN,
    # NTFY_TOKEN and TS_AUTHKEY stay out of a container that sits on the host network
    # with unauthenticated ports (5000, 1984). Frigate substitutes FRIGATE_* values in
    # config.yml via the {FRIGATE_RTSP_PASSWORD} syntax. Need more (for example
    # FRIGATE_CAM2_PASSWORD)? Add a line here, or put it in a docker-compose.override.yml.
    environment:
      TZ: ${TZ:-UTC}
      FRIGATE_RTSP_USER: ${FRIGATE_RTSP_USER:-}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-}
      FRIGATE_HOST_LAN_IP: ${FRIGATE_HOST_LAN_IP:-}
      GO2RTC_ALLOW_ARBITRARY_EXEC: ${GO2RTC_ALLOW_ARBITRARY_EXEC:-false}
    # Shared memory for decoded frames. Raise as you add cameras (see Frigate docs).
    shm_size: ${FRIGATE_SHM_SIZE:-256mb}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Map the ENTIRE config folder (Unraid gotcha) — not just config.yml — so
      # Frigate can write its DB, model cache, and migrated config.
      - ./frigate:/config
      # Recordings / snapshots / clips. Point STORAGE_PATH at a real disk/array.
      - ${STORAGE_PATH:-./storage/frigate}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

  mqtt:
    container_name: mosquitto
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.0.22}
    restart: unless-stopped
    # Published on the host's LOOPBACK only: the broker is anonymous, so it must not
    # be reachable from your LAN. Frigate and the dashboard (host network) reach it
    # at 127.0.0.1:1883. For Home Assistant on another machine, use
    # compose.mqtt-lan.yml (adds a password-protected listener on 1884).
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # --- Control dashboard (single Go binary serving the React SPA) -------------
  # One pane for cameras + printers + container health + alerts. Reached over the
  # tailnet at http://<host>:8088. No config file is required to start: printers
  # and cameras can be added from the UI. On first run the dashboard writes a
  # commented dashboard/data/config.yaml you can edit (see config.example.yaml).
  dashboard:
    container_name: dashboard
    image: ${DASHBOARD_IMAGE:-tinkerview:latest}
    build: ./dashboard
    restart: unless-stopped
    network_mode: host # reach Frigate :5000/:1984, Mosquitto :1883, dockerproxy :2375, printers on LAN
    # No `env_file` on purpose: the dashboard gets only the variables below, not
    # your camera passwords (FRIGATE_RTSP_*) or other secrets from .env.
    environment:
      TZ: ${TZ:-UTC}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_LISTEN: ${DASHBOARD_LISTEN:-}
      DASHBOARD_LOG_LEVEL: ${DASHBOARD_LOG_LEVEL:-}
      DASHBOARD_WS_ORIGINS: ${DASHBOARD_WS_ORIGINS:-}
      DOCKER_HOST: ${DASHBOARD_DOCKER_HOST:-tcp://127.0.0.1:2375} # not ${DOCKER_HOST}: that is YOUR engine socket (podman sets it)
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:8092}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      # The dashboard's ONLY writable mount, and the single source of its state:
      # config.yaml, UI-added printers/cameras (devices.yaml), Frigate backups.
      #
      # Deliberately a DIRECTORY, never a single file. Docker creates a directory
      # in place of a bind-mounted file that doesn't exist on the host, which used
      # to leave new installs with an unusable dashboard/config.yaml/ folder.
      #
      # The container runs as distroless :nonroot (uid 65532), so the host dir must
      # be writable by that uid — create it before first start:
      #   mkdir -p ./dashboard/data && chown 65532:65532 ./dashboard/data
      #
      # UPGRADING from a version that mounted ./dashboard/config.yaml:/config.yaml?
      # Move the file into this directory and it keeps working:
      #   mv ./dashboard/config.yaml ./dashboard/data/config.yaml
      # (Keeping the old mount line also still works — the legacy path is read as a
      # fallback — but new installs should not add it.)
      - ./dashboard/data:/data
      - ${STORAGE_PATH:-./storage/frigate}:/media/frigate:ro # disk usage of the recordings volume
    # The image's own HEALTHCHECK does the same thing; repeated here so it also
    # applies to images built without one (e.g. podman's default OCI format).
    healthcheck:
      test: ["CMD", "/dashboard", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on: [frigate, mqtt, dockerproxy]

  # --- ntfy (self-hosted push notifications) ----------------------------------
  # Create a publish token for the dashboard and a subscribe token for your phone:
  #   docker exec -it ntfy ntfy user add --role=admin admin   (then `ntfy token add admin`)
  ntfy:
    container_name: ntfy
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:v2.11.0}
    command: serve
    restart: unless-stopped
    network_mode: host
    environment:
      NTFY_LISTEN_HTTP: ":8092"
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:8092}
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Relays a content-free poll request to ntfy.sh so iOS gets instant push. Set
      # NTFY_UPSTREAM_BASE_URL= (empty) in .env to switch it off; Android is unaffected.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL-https://ntfy.sh}
    volumes:
      - ./ntfy:/var/lib/ntfy

  # --- docker-socket-proxy (least-privilege Docker access for health/restart) -
  # The dashboard talks to THIS, never the raw socket. Default is READ-ONLY
  # (POST=0): the container panel lists containers and shows stats, and the Restart
  # button is disabled. Caveat: this proxy version cannot limit POST to "restart"
  # only; DOCKERPROXY_POST=1 also permits container creation, which is root-equivalent
  # on the host, so it is an opt-in. The port is bound to loopback either way.
  # See SECURITY.md.
  dockerproxy:
    container_name: docker-socket-proxy
    image: ${DOCKERPROXY_IMAGE:-tecnativa/docker-socket-proxy:0.3.0}
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # list/inspect/stats
      POST: ${DOCKERPROXY_POST:-0} # 0 = read-only (default); 1 = allow the restart POST (root-equivalent, see SECURITY.md)
    ports:
      - "127.0.0.1:2375:2375" # loopback only; dashboard reaches it via host networking
    volumes:
      # Rootless podman has no /var/run/docker.sock: install.sh sets DOCKER_SOCKET_PATH in
      # .env to your user socket (for example /run/user/1000/podman/podman.sock).
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
